<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>{% block title %}Captain's Log{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div class="shell">

  <header class="masthead">
    <h1 class="lcars-title">{% block heading %}Captain's log{% endblock %}</h1>
    <span class="masthead-meta">{% block meta %}{% endblock %}</span>
  </header>

  <div class="divider" aria-hidden="true">
    <span class="divider-cap"></span>
    <span class="divider-bar"></span>
  </div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alerts" role="alert">
        {% for message in messages %}<p>{{ message }}</p>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

</div>
{% block scripts %}{% endblock %}
</body>
</html>
